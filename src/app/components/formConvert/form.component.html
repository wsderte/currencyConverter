<div class="modal" *ngIf="currentModal === 'modal1'">
    <div class="modal-content">
        <div class="modal-box">
            <span class="close" (click)="closeModal()">&times;</span>
            <div class="vertical-content">
                <div class="text-content">
                    <span class="title">{{"Как вы хотите получить заказ?"}}</span>
                    <div>
                        <div class="text">{{"Доставим до Вас или заберите у нас."}}</div>
                        <div class="text">{{"Зарегистрируйтесь у нас на сайте и мы запомним Ваш адрес доставки, для Вашего удобства."}}</div>
                    </div>    
                </div>

                <button (click)="showModal('modal2')" class="button delivery-button">{{"Доставка"}} </button>
                <button (click)="showModal('modal2')" class="button">{{"Самовывоз"}}</button>

                <div class="center">
                    <span class="link text">{{"Войти"}}</span> 
                    <span class="text"> {{" в свой аккаунт"}} </span> 
                </div>
            </div>
        </div>

      <ng-content></ng-content>
    </div>
</div>

<div class="modal" *ngIf="currentModal === 'modal2'">
    <div class="modal-content">
        <div class="modal-box">
            <span class="close" (click)="closeModal()">&times;</span>
            <div class="vertical-content">

                <button (click)="showModal('modal1')" class="button delivery-button">{{"Доставка"}} </button>
                <button (click)="showModal('modal1')" class="button">{{"Самовывоз"}}</button>

            </div>
        </div>
        <!-- <mat-slide-toggle>Toggle me!</mat-slide-toggle> -->

      <ng-content></ng-content>
    </div>
</div>
